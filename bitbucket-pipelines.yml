image: maven:3.8-openjdk-17

pipelines:
  default:
    - parallel:
        - step:
            name: Build and Tests
            caches:
              - maven
            script:
              - mvn clean install -B  # Run the build with Maven
            after-script:
              # Collect checkstyle results, if any, and convert to Bitbucket Code Insights.
              - pipe: atlassian/checkstyle-report:0.3.0

  branches:
    master:
      - step:
          name: Build and Tests
          caches:
            - maven
          script:
            - mvn clean install -B

    develop:
      - step:
          name: Build and Tests
          caches:
            - maven
          script:
            - mvn clean install -B
